name: Memory management

on: [push, pull_request]

permissions:
  contents: read

jobs:
  memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build host suites with address and undefined-behavior sanitizers
        run: |
          cmake -S . -B "$RUNNER_TEMP/native" -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          cmake --build "$RUNNER_TEMP/native" --parallel
          ctest --test-dir "$RUNNER_TEMP/native" \
            -L '^(drivers|memory|storage|user|tooling)$' --output-on-failure
      - name: Test scheduler host context switching with UBSan
        # ASan does not fully support the POSIX ucontext stack-switching model.
        run: |
          cmake -S . -B "$RUNNER_TEMP/scheduler" -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS="-fsanitize=undefined -fno-omit-frame-pointer"
          cmake --build "$RUNNER_TEMP/scheduler" --target task_smp_test --parallel
          ctest --test-dir "$RUNNER_TEMP/scheduler" -L scheduler --output-on-failure

      - name: Install GNU AArch64 tools and model dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          python -m pip install unicorn==2.1.4 capstone==5.0.7
      - name: Build default (V3D) and forced-CPU kernels and test linked paths
        # V3D=0 removes the boot-time GPU probe; both images must pass every suite.
        run: |
          make BUILD_DIR="$RUNNER_TEMP/arm" -j2
          make BUILD_DIR="$RUNNER_TEMP/cpu" V3D=0 -j2
          for build in arm cpu; do
            for suite in memory_management secondary_startup terminal tasks task_smp files pi4_drivers storage file_storage; do
              python "tests/arm/$suite.py" "$RUNNER_TEMP/$build/kernel8.elf" -v
            done
          done
      - name: Boot both kernels against working, absent and failing V3D models
        run: |
          python tests/arm/v3d_boot.py "$RUNNER_TEMP/arm/kernel8.elf" \
            "$RUNNER_TEMP/cpu/kernel8.elf" -v
      - name: Compile default GPU and Wi-Fi path with synthetic assets
        # Compile-only fixture: these bytes are not usable radio firmware.
        run: |
          mkdir -p "$RUNNER_TEMP/wifi"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'wifi'
          (root / 'firmware.bin').write_bytes(b'\x01\x02\x03\x04' * 8)
          (root / 'nvram.txt').write_text('boardtype=0x1\n')
          (root / 'clm.bin').write_bytes(b'synthetic-compile-fixture')
          PY
          python tools/embed_wifi.py --firmware "$RUNNER_TEMP/wifi/firmware.bin" \
            --nvram "$RUNNER_TEMP/wifi/nvram.txt" --clm "$RUNNER_TEMP/wifi/clm.bin" \
            --country GB --regrev 0 --output "$RUNNER_TEMP/wifi/assets.c"
          make BUILD_DIR="$RUNNER_TEMP/wifi-arm" WIFI=1 \
            WIFI_FIRMWARE_C="$RUNNER_TEMP/wifi/assets.c" -j2
      - name: Verify storage boot gate and option-sensitive rebuilding
        run: |
          cp "$RUNNER_TEMP/arm/kernel8.elf" "$RUNNER_TEMP/default-kernel8.elf"
          make BUILD_DIR="$RUNNER_TEMP/arm" STORAGE_VALIDATION=1 \
            SD_BASE_CLOCK_HZ=100000000 STORAGE_PARTITION=1 -j2
          python tests/arm/storage_boot.py "$RUNNER_TEMP/default-kernel8.elf" \
            "$RUNNER_TEMP/arm/kernel8.elf" -v

  desktop:
    name: Desktop terminal and simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
      - name: Build simulator and run integration tests
        run: |
          cmake -S . -B "$RUNNER_TEMP/desktop" -DCMAKE_BUILD_TYPE=Release \
            -DVANTAGE_BUILD_SIMULATOR=ON
          cmake --build "$RUNNER_TEMP/desktop" --parallel
          ctest --test-dir "$RUNNER_TEMP/desktop" -L simulator --output-on-failure
